<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | GeoScan Engineering</title>
    <meta name="description" content="Contact GeoScan Engineering for geophysical, geotechnical, and engineering investigation services in Kenya." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html">
          <span class="brand-mark">G</span>
          <span>GeoScan</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="approach.html">Approach</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero small hero-contact">
        <div class="container">
          <p class="eyebrow">Contact</p>
          <h1>Let’s talk about your next project.</h1>
        </div>
      </section>

      <section class="section">
        <div class="container contact-layout">
          <div class="contact-card">
            <h3>Get in touch</h3>
            <ul class="contact-list">
              <li><strong>Email:</strong> hello@geoscanengineering.co.ke</li>
              <li><strong>Phone:</strong> +254 700 000 000</li>
              <li><strong>Location:</strong> Nakuru, Kenya</li>
            </ul>
          </div>

          <form class="contact-form">
            <label>
              Name
              <input type="text" placeholder="Your full name" />
            </label>
            <label>
              Email
              <input type="email" placeholder="you@example.com" />
            </label>
            <label>
              Company
              <input type="text" placeholder="Organization" />
            </label>
            <label>
              Project details
              <textarea rows="5" placeholder="Tell us about your site investigation or project requirements"></textarea>
            </label>
            <button type="submit" class="button primary">Send inquiry</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div><a class="brand footer-brand" href="index.html"><span class="brand-mark">G</span><span>GeoScan</span></a></div>
        <div><p>Engineering insight for better decisions.</p></div>
        <div><a href="contact.html">hello@geoscanengineering.co.ke</a></div>
      </div>
    </footer>
  </body>
</html>
